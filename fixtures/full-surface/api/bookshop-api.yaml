openapi: 3.1.0
info:
  title: Bookshop API
  version: 1.0.0
paths:
  /books/{isbn}:
    get:
      operationId: getBook
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The book with the given ISBN
          content:
            application/json:
              schema:
                type: object
                required: [isbn, title]
                properties:
                  isbn:
                    type: string
                  title:
                    type: string
        "404":
          description: No book has the given ISBN
