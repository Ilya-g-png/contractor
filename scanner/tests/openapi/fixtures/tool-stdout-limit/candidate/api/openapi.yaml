openapi: 3.0.3
info:
  title: Fixture Pets
  version: 1.0.0
paths:
  /pets:
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "201":
          description: Created
components:
  schemas:
    NewPet:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 64
        species:
          type: string
          enum:
            - cat
            - dog
            - bird
        nickname:
          type: string
